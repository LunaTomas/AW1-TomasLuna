<!DOCTYPE html>
<!-- indica al navegador que el documento utiliza HTML5. Es importante para que el navegador interprete correctamente el código. -->
<html lang="es">
<!-- es el elemento raíz del documento. Todo el contenido HTML se encuentra dentro de esta etiqueta. El atributo lang="es" indica que el idioma principal es español. -->
<head>
<!-- contiene información sobre el documento que generalmente no se muestra directamente en la página. -->
    <meta charset="UTF-8">
    <!-- permite utilizar correctamente caracteres como á, é, ñ, etc. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ayuda a que la página se adapte correctamente a diferentes tamaños de pantalla, especialmente celulares y tablets. -->
    <title>Aplicaciones Web 1</title>
    <!-- define el título que aparece en la pestaña del navegador. -->
</head>

<body>
    <!-- contiene todo el contenido visible de la página. -->
    <header>
        <h1>Actividad 4</h1>
    </header>

    <main>
        <section>
            <h2>¿Qué es HTML?</h2>
            <p>
                HTML es el lenguaje utilizado para estructurar el contenido
                de una página web.
            </p>
        </section>

        <section>
            <h2>¿Para qué sirve?</h2>
            <p>
                Permite organizar textos, imágenes, enlaces y otros elementos
                que forman parte de un sitio web.
            </p>
        </section>
    </main>

    <footer>
        <p>Conrado Luna - Aplicaciones Web</p>
    </footer>
</body>
</html>
